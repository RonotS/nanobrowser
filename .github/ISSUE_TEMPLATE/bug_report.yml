name: Bug report
description: Something in Bash AI did not work as it should
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Never paste passwords, API keys, tokens or card numbers here. A security problem goes privately to the owner (see SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Bash AI version
      description: Shown in Settings → About.
      placeholder: e.g., 0.3.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      placeholder: What you asked, what Bash AI did, and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. I asked '...'
        2. It opened '...'
        3. I saw '...'
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - Claude
        - OpenAI
        - Grok
        - Voice agent
        - Not sure
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Your Command Center role
      placeholder: e.g., CSM, Media Buyer, ISA

  - type: textarea
    id: context
    attributes:
      label: Screenshots or other details
