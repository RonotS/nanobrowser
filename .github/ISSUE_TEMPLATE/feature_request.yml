name: Feature
description: Suggest something Bash AI should do
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
      placeholder: The task, and how you do it today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What should Bash AI do?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, the SOP it follows, the role it is for.
